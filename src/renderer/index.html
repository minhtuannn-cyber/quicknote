<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;" />
  <title>QuickNote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-container">

    <!-- ─── Custom Title Bar ─────────────────────────────────────────── -->
    <header class="title-bar" id="titleBar">
      <div class="title-bar-left">
        <span class="app-logo">✦</span>
        <span class="app-title">QuickNote</span>
      </div>
      <div class="title-bar-right">
        <button class="title-btn" id="btnSync" title="Sync with Notion (Cmd+Shift+S)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6"/>
            <path d="M2.5 22v-6h6"/>
            <path d="M2 11.5a10 10 0 0 1 18.8-4.3"/>
            <path d="M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
        <button class="title-btn" id="btnToggleTheme" title="Toggle theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="title-btn" id="btnTogglePin" title="Toggle always on top">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="17" x2="12" y2="22"/>
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/>
          </svg>
        </button>
        <button class="title-btn" id="btnMinimize" title="Minimize">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="title-btn title-btn-close" id="btnClose" title="Hide (Cmd+Shift+N to show)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ─── Main Content ──────────────────────────────────────────── -->
    <main class="main-content">
      
      <!-- Sidebar (Notes List) -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button class="btn-new-note" id="btnNewNote" title="New note (Cmd+N)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span>New Note</span>
          </button>
          <div class="search-container">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Search notes..." />
          </div>
        </div>
        <div class="notes-list" id="notesList">
          <!-- Notes will be rendered here -->
        </div>
        <div class="sidebar-footer">
          <span class="notes-count" id="notesCount">0 notes</span>
        </div>
      </aside>

      <!-- Editor Area -->
      <section class="editor-area" id="editorArea">
        <div class="editor-toolbar" id="editorToolbar">
          <button class="toolbar-btn" id="btnToggleSidebar" title="Toggle sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
          <input type="text" class="note-title-input" id="noteTitleInput" placeholder="Note title..." />
          <div class="toolbar-actions">
            <button class="toolbar-btn" id="btnPinNote" title="Pin note">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="17" x2="12" y2="22"/>
                <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/>
              </svg>
            </button>
            <button class="toolbar-btn toolbar-btn-danger" id="btnDeleteNote" title="Delete note">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </div>
        <textarea class="note-editor" id="noteEditor" placeholder="Start typing your note..."></textarea>
        <div class="editor-footer">
          <span class="save-status" id="saveStatus">Ready</span>
          <span class="char-count" id="charCount">0 characters</span>
        </div>
      </section>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">✦</div>
        <h2>QuickNote</h2>
        <p>Press the <kbd>+</kbd> button or <kbd>Cmd+N</kbd> to create a new note</p>
        <p class="shortcut-hint">Use <kbd>Cmd+Shift+N</kbd> to show/hide this window</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
